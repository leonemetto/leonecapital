name: Telegram Deploy Notification

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          curl -s -X POST "https://aepmcmfidvkdjjgjvkkw.supabase.co/functions/v1/telegram-bot" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg commit "$COMMIT_MSG" '{type: "deploy", status: "success", commit: $commit, branch: "main"}')"
