        "@type": "Offer",

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is EdgeFlow?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EdgeFlow is a professional trading journal by Leone Capital that combines AI-powered analytics, leak detection, behavioral pattern tracking, and multi-account management to help traders improve performance."
          }
        },
        {
          "@type": "Question",
          "name": "Does EdgeFlow have a free trial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. EdgeFlow includes a 14-day no-card Pro trial after onboarding. When the trial ends, upgrade to Pro to continue logging trades, importing history, using Atlas, and running advanced analysis."
          }
        },
        {
          "@type": "Question",
          "name": "What markets does EdgeFlow support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EdgeFlow supports all markets including currencies, stocks, crypto, futures, indices, and commodities. If you can trade it, you can journal and analyze it."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI trading advisor work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EdgeFlow's AI advisor analyzes your complete trade history to identify patterns, detect performance leaks, and provide personalized recommendations based on your actual data — not generic advice."
          }
        }
      ]
    }
    </script>
